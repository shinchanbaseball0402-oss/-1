<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>無料相談 | まるっとオフィス</title>
    <style>
        :root { --primary-blue: #0072CE; --primary-cyan: #00A3C4; --dark-blue: #0A2540; --bg-light: #F4F8FA; --text: #2D3748; --white: #FFFFFF; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; color: var(--text); background: var(--bg-light); line-height: 1.6; }
        header { background: var(--white); box-shadow: 0 2px 8px rgba(0,0,0,0.05); position: sticky; top: 0; }
        .header-in { max-width: 1100px; margin: 0 auto; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 20px; font-weight: bold; color: var(--dark-blue); text-decoration: none; display: flex; align-items: center; gap: 8px; }
        .logo-icon { width: 35px; height: 35px; background: linear-gradient(135deg, var(--primary-cyan), var(--primary-blue)); color: var(--white); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        nav ul { display: flex; list-style: none; gap: 20px; }
        nav a { text-decoration: none; color: var(--text); font-weight: bold; font-size: 14px; }
        nav a.active { color: var(--primary-blue); }
        .btn-nav { background: var(--primary-blue); color: var(--white) !important; padding: 8px 16px; border-radius: 20px; }
        .page-head { background: var(--dark-blue); color: var(--white); padding: 40px 20px; text-align: center; }
        .form-card { max-width: 600px; margin: 50px auto; background: var(--white); padding: 40px 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 8px; font-size: 14px; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 12px; border: 1px solid #CCC; border-radius: 6px; font-size: 15px; }
        .btn-submit { width: 100%; background: linear-gradient(135deg, var(--primary-cyan), var(--primary-blue)); color: var(--white); border: none; padding: 16px; font-size: 18px; font-weight: bold; border-radius: 30px; cursor: pointer; }
        footer { background: var(--dark-blue); color: #AAA; text-align: center; padding: 30px 20px; margin-top: 80px; font-size: 13px; }
    </style>
</head>
<body>
    <header>
        <div class="header-in">
            <a href="index.html" class="logo"><div class="logo-icon">ま</div>まるっとオフィス</a>
            <nav>
                <ul>
                    <li><a href="index.html">ホーム</a></li>
                    <li><a href="services.html">サービス内容</a></li>
                    <li><a href="features.html">メリット・デメリット</a></li>
                    <li><a href="contact.html" class="btn-nav active">無料相談</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="page-head">
        <h1>無料相談・お問い合わせ</h1>
        <p>マルトくんと一緒に最適なプランを考えましょう！</p>
    </div>

    <div class="form-card">
        <form action="#" method="post">
            <div class="form-group">
                <label>お名前</label>
                <input type="text" placeholder="山田 太郎" required>
            </div>
            <div class="form-group">
                <label>ご職業</label>
                <select>
                    <option>アスリート</option>
                    <option>個人事業主・フリーランス</option>
                    <option>その他</option>
                </select>
            </div>
            <div class="form-group">
                <label>メールアドレス</label>
                <input type="email" placeholder="example@email.com" required>
            </div>
            <div class="form-group">
                <label>ご相談内容</label>
                <textarea rows="5" placeholder="困っている事務作業やご質問を入力してください"></textarea>
            </div>
            <button type="submit" class="btn-submit">送信する（無料）</button>
        </form>
    </div>

    <footer>&copy; 2026 まるっとオフィス All Rights Reserved.</footer>
</body>
</html>
